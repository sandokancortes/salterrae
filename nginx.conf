server {
    listen 80;
    server_name salterrae.com www.salterrae.com;  # Cambiar por tu dominio
    
    # Redirección a HTTPS (descomentar cuando tengas SSL)
    # return 301 https://$server_name$request_uri;
    
    # Logs
    access_log /var/log/nginx/salterrae_access.log;
    error_log /var/log/nginx/salterrae_error.log;
    
    # Tamaño máximo de archivos
    client_max_body_size 10M;
    
    # Archivos estáticos
    location /static/ {
        alias /var/www/salterrae/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Proxy a Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

